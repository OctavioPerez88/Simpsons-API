<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Los Simpson API</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="logo">
      <h1>Los Simpson</h1>
    </div>
    <nav>
      <ul>
        <li><a href="#" data-view="home">Inicio</a></li>
        <li><a href="#" data-view="characters">Personajes</a></li>
        <li><a href="#" data-view="selector">Selector</a></li>
      </ul>
    </nav>
  </header>
  <div id="app">
    <section id="home" class="view">
      <div class="hero">
        <h2>Bienvenides a Los Simpson</h2>
        <p>Explora los personajes de la ciudad de Springfield.</p>
      </div>
      <section class="random-section">
        <button id="random-character-button" type="button" class="btn btn-rosquilla">
          Descubrir personajes random
        </button>
        <div id="random-character"></div>
      </section>
    </section>
    <section id="characters" class="view">
      <div class="filter_bar">
        <input type="text" id="character-search-name" placeholder="Buscar por nombre...">
        <button type="button" id="character-search-button" class="btn btn-rosquilla">Buscar</button>
      </div>

      <p id="loading-message" hidden>Cargando personajes...</p>

      <div class="characters"></div>
      
      <div id="pagination" class="paginacion-simpson"></div>
    </section>
    <section id="locations" class="view">
      <div class="locations"></div>
      <div id="location-pagination" class="paginacion-simpson"></div>
    </section>
    <section id="episodes" class="view">
      <div class="episodes"></div>
      <div id="episode-pagination" class="paginacion-simpson"></div>
    </section>
    <section id="selector" class="view">
      <div class="hero">
        <h2>Selector de Personaje</h2>
        <p>Elige tu personaje favorito de Los Simpson.</p>
      </div>
      <div class="selector-container">
        <button id="selector-load-button" type="button" class="btn btn-rosquilla">Cargar personajes</button>
        <select id="selector-personaje">
          <option value="">-- Primero carga los personajes --</option>
        </select>
        <div id="selector-info">
          <p class="selector-placeholder">Aquí verás la información de tu personaje favorito.</p>
        </div>
      </div>
    </section>
  </div>
  <footer>
    <p>Equipo Ponys Rosas</p>
  </footer>
  <div id="error-modal" class="modal" hidden>
    <div class="modal_box">
      <p id="error-modal-message"></p>
      <button type="button" id="error-modal-close" class="btn btn-atras" style="opacity: 1; cursor: pointer;">Cerrar</button>
    </div>
  </div>
  <div id="detail-modal" class="modal" hidden>
    <div class="modal_box modal_box_large">
      <button type="button" id="detail-modal-close" class="modal_close" aria-label="Cerrar">&times;</button>
      <div id="detail-modal-content"></div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/selector.js"></script>
</body>

</html>
